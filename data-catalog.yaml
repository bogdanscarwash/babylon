tables:
  - name: bridge_cfs_county
    kind: table
    source: FAF5
    extractor: babylon-data src/babylon_data/faf_bridge/ (2026-09-04, PER-31)
    disposition: keep
    subset_policy: full
    material_relation: county-to-CFS-area allocation crosswalk — the geographic key
      needed to scope FAF/CFS freight flows to counties. 3,148 rows across all
      132 zones, built from the held FAF5 county-disaggregation factor files.
    notes: "Weights are Derived, never Observed: the 2022-tonnage-weighted mean
      of the mode x SCTG-G5 county factors, origin+destination pooled, over
      modes 1/2/3/5 only (air/intermodal/other excluded). County membership is
      deterministic; the weight is FAF's modeled allocation. Per-zone weight
      sums equal the covered-tonnage share (~0.89-1.00, Detroit 261: 0.9882)
      and are NOT renormalized — the residual is tonnage FAF county factors do
      not allocate. Loads idempotently via python -m babylon_data.faf_bridge."
  - name: bridge_county_h3
    kind: table
    source: derived
    extractor: tools/ingest_tiger_geometry.py
    consumers:
      - src/babylon/engine/hydration/reference.py
      - tools/ingest_tiger_geometry.py
    tests:
      - tests/integration/mvp/test_hydration.py
      - tests/integration/test_michigan_reference_data.py
    disposition: keep
    subset_policy: full
    material_relation: county-to-H3-hex spatial index — the hex-grid substrate join
      enabling territory/hex hydration (Constitution spatial substrate).
  - name: bridge_county_metro
    kind: table
    source: OMB_CBSA
    extractor: deleted @ 4ce7c96a^ (src/babylon/data/census/cbsa_parser.py)
    tests:
      - tests/integration/test_michigan_reference_data.py
    disposition: keep
    subset_policy: full
    material_relation: county-to-Metropolitan-Statistical-Area membership — the urban-agglomeration
      key for the MSA-tier zoom hierarchy (Detroit MSA tests).
  - name: bridge_naics_bea
