      bsl-language.rst` measured base 609 errors (pre-Task-9) + 20 new
      findings from this task's own D166-D174 content = 629, then 629 -
      2 (one `'very'`-weasel-word instance trivially reworded) = **627**
      final — the remaining 20 new findings are passive-voice emphasis-
      caps (`REJECTED`/`OMITTED`/etc, this document's own established
