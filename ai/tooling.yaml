# Babylon Tooling Configuration
# How tools are configured and why

meta:
  version: "1.4.0"
  updated: "2026-09-01"
  purpose: "Document tooling decisions to avoid re-investigation"

# =============================================================================
# CI/CD TOOLING
# =============================================================================

cicd:
  philosophy: "Block on correctness, not style"
  governance: "Agentic Engineering model (Constitution IX.5 / Amendment AD; ADR151) - Director + gate-licensed agents; see CONTRIBUTORS.md and ci-workflow.yaml"

  github_actions:
    ci_yml:
      file: ".github/workflows/ci.yml"
      triggers:
        push: ["main", "dev"]
        pull_request: ["main", "dev"]
      jobs:
        ci:
          name: "Lint, Type Check & Test"
          blocks_merge: true
          steps:
            - "poetry run ruff check ."
            - "poetry run mypy src"
            - "poetry run pytest -m 'not ai' --tb=short -q"
        docs:
          name: "Documentation Build"
          blocks_merge: true
          steps:
            - "poetry run pytest --doctest-modules src/babylon/systems/formulas.py -v"
            - "cd docs && poetry run sphinx-build -b html . _build/html"
          note: "No -W flag - warnings allowed in CI, strict mode available locally"
        style:
          name: "Style Check (Informational)"
          blocks_merge: false
          continue_on_error: true
          steps:
            - "poetry run ruff format --check ."

    weekly_py313_yml:
      file: ".github/workflows/weekly-py313.yml"
      triggers: ["weekly Sunday 04:00 UTC", "workflow_dispatch"]
      purpose: "Python 3.13 forward-compatibility suite"
    weekly_sim_artifacts_yml:
      file: ".github/workflows/weekly-sim-artifacts.yml"
      triggers: ["weekly Sunday 04:00 UTC", "workflow_dispatch"]
      authority: "Authoritative Rust game-managed PostgreSQL path"
      scope: "Fixed-seed embedded two-rule Michigan Rust persistence slice; not full content-pack coverage"
      command: "mise run sim:report 520 3000 exclusive"
      artifact: "reports/sim-runs/"
      retention_days: 90
    weekly_reference_analysis_yml:
      file: ".github/workflows/weekly-reference-analysis.yml"
      triggers: ["weekly Monday 04:00 UTC", "workflow_dispatch: weekly or full"]
      authority: "Non-authoritative frozen Python reference at p27-python-freeze"
      command: "mise run analysis:campaign -- {weekly|full}"
      artifact: "reports/frozen-reference-analysis/"
      retention_days: 90

  pr_template:
    file: ".github/PULL_REQUEST_TEMPLATE.md"
    tone: "Beginner-friendly, welcoming"
    key_message: "Checklist is a guide, not a gate"

  pre_commit:
    file: ".pre-commit-config.yaml"
    purpose: "Local style enforcement (not CI)"
    hooks:
      - "ruff (lint)"
      - "ruff (format)"
      - "mypy (typecheck)"
      - "pytest (fast tests)"
      - "yamllint"
      - "commitizen (commit message)"

# =============================================================================
# DOCUMENTATION TOOLING
# =============================================================================

documentation:

  sphinx:
    config_file: "docs/conf.py"
    key_settings:
      autosummary_imported_members: false
      reason: "Prevents duplicate documentation of re-exported classes"

      html_static_path: "[]"
      reason: "No custom static files, avoids missing directory warning"

      autodoc_default_options:
        members: true
        undoc_members: true
        show_inheritance: true

    extensions:
      - "sphinx.ext.autodoc"
      - "sphinx.ext.autosummary"
      - "sphinx.ext.viewcode"
      - "sphinx.ext.intersphinx"
      - "sphinx.ext.doctest"
      - "sphinx.ext.todo"
      - "sphinx.ext.coverage"
      - "sphinx_autodoc_typehints"
      - "myst_parser"
      - "sphinxcontrib.mermaid"  # Diagram support for flowcharts

    ci_flags:
      b_html: "HTML builder"
      note: "-W (warnings as errors) removed from CI, available via mise run docs-strict"

    suppress_warnings:
      config_location: "docs/conf.py"
      suppressed:
        - "autodoc"
        - "autodoc.import_object"
        - "ref.python"
        - "ref.ref"
        - "myst.xref_missing"
        - "docutils"
      reason: "Pydantic model re-exports cause unavoidable duplicate object warnings"

  docstring_format:
    style: "RST (reStructuredText)"
    reason: "Sphinx autodoc native format"
    rules:
      - "Use :: for code blocks, not markdown ```"
      - "Use *italic* and **bold** with proper spacing"
      - "Use :class:`ClassName` for cross-references"
      - "Blank line before and after code blocks"
      - "Examples should pass doctest"

    examples:
      good: |
        """Calculate imperial rent.

        The formula applies Marxist value theory to compute
        the surplus extracted via unequal exchange.

        Args:
            wages: Currency amount paid to workers
            value: Currency amount of value produced

        Returns:
            Imperial rent (Phi) extracted

        Example:
            >>> calculate_imperial_rent(wages=100.0, value=80.0)
            20.0

        See Also:
            :func:`calculate_exploitation_rate`
        """
      bad: |
        """
        Calculate imperial rent.
        Uses `code` markdown style - WRONG for RST
        Returns the **bold without spaces**error
        """

# =============================================================================
# LINTING TOOLING
# =============================================================================

linting:

  ruff:
    config_file: "pyproject.toml"
    version: "^0.14.0"
    important: "Must match pre-commit version exactly"
    settings:
      line_length: 100
      target_version: "py312"
      select:
        - "E"   # pycodestyle errors
        - "W"   # pycodestyle warnings
        - "F"   # pyflakes
        - "I"   # isort
        - "B"   # bugbear
        - "C4"  # comprehensions
        - "UP"  # pyupgrade
        - "ARG" # unused arguments
        - "SIM" # simplify
      ignore:
        - "E501"  # line length (handled by formatter)

  mypy:
    config_file: "pyproject.toml"
    mode: "strict"
    settings:
      python_version: "3.12"
      strict: true
      disallow_untyped_defs: true
      warn_return_any: true
      show_error_codes: true
      exclude: ["tests/", "build/", "dist/", "assets/music/"]

  yamllint:
    config_file: ".yamllint.yaml"
    settings:
      line_length: 120
      indentation: 2
      truthy_allowed: ["true", "false", "on", "off", "yes", "no"]
    ignore:
      - ".venv/"
      - ".git/"
      - "node_modules/"
      - "brainstorm/"
      - "docs/character_sheets/"
      - "ai/"
    reason_for_ai_docs_ignore: "Prose with long lines, not infrastructure config"

# =============================================================================
# CODE COMPLEXITY ANALYSIS
# =============================================================================

code_complexity:
  philosophy: "Guard against unmaintainable code in AI-heavy development (80% AI-written)"

  rationale: |
    When AI writes 80% of the code, complexity guardrails aren't over-engineering—
    they're essential. Without gates, AI can produce sprawling functions that pass
    tests but become debugging nightmares. Cyclomatic complexity catches these
    before they merge.

  metrics:
    cyclomatic_complexity:
      status: "primary"
      tool: "radon"
      description: "Count of independent code paths through a function"
      why_it_matters: |
        High CC = hard to test, hard to understand, bug-prone.
        Mathematical formulas should be pure functions with low CC.
        Orchestration code may legitimately be higher, but has limits.
      grading_scale:
        A: "1-5 (simple, low risk)"
        B: "6-10 (moderate complexity, acceptable)"
        C: "11-20 (complex, should consider refactoring)"
        D: "21-30 (very complex, needs attention)"
        E: "31-40 (untestable, urgent refactoring)"
        F: "41+ (error-prone, critical issue)"

    maintainability_index:
      status: "excluded"
      reason: |
        MI is a composite score combining CC, Halstead volume, and LOC.
        Problem: Babylon's mandatory Sphinx docstrings artificially inflate MI.
        A function could have good MI but still be poorly structured.
        CC alone is sufficient with our existing 100-line function rule.

    halstead_metrics:
      status: "excluded"
      reason: "Too academic, high noise-to-signal ratio. Rarely actionable."

    raw_loc:
      status: "excluded"
      reason: "Already enforced via CLAUDE.md 100-line function rule."

  tools:
    radon:
      purpose: "Detailed complexity reporting"
      package: "radon"
      usage: "poetry run radon cc src/ -a -s"
      output: "Per-function CC grades, averages, summary"
      when_used: "All CI runs (informational)"

    xenon:
      purpose: "Pass/fail complexity gating"
      package: "xenon"
      usage: "poetry run xenon --max-absolute C src/"
      output: "Exit code 0 (pass) or 1 (fail)"
      when_used: "Blocking gate on main branch only"

    ruff_c901:
      purpose: "Fast local feedback via pre-commit"
      package: "ruff (built-in mccabe rule)"
      usage: "Enabled in ruff config with max-complexity = 15"
      when_used: "Pre-commit hook (immediate developer feedback)"

  thresholds:
    warning_level:
      cc_value: 10
      grade: "B/C boundary"
      enforcement: "Informational only, shown in CI logs"

    blocking_level:
      cc_value: 15
      grade: "Stricter than Google (10), pragmatic for existing codebase"
      enforcement: "Blocks merge to main via Xenon"
      rationale: |
        Why 15 instead of 10?
        - Codebase already exists with potential complexity
        - Starting strict risks false positives that frustrate adoption
        - Can tighten to 10 after baselining current state
        - Industry median is 10-15, this is reasonable middle ground

  workflow:
    feature_branches:
      complexity_check: "none"
      rationale: "Active development is messy, allow iteration"

    pull_requests_to_dev:
      complexity_check: "radon report (informational)"
      blocks_merge: false
      rationale: "Visibility without friction, developers see the stats"

    pull_requests_to_main:
      complexity_check: "xenon gate"
      blocks_merge: true
      rationale: "Quality gate before stable releases"

    push_to_main:
      complexity_check: "xenon gate"
      blocks_merge: true
      rationale: "Redundant safety for direct pushes (Director only)"

  ci_integration:
    all_branches:
      step_name: "Code Complexity Report"
      command: "poetry run radon cc src/ -a -s --show-complexity"
      continue_on_error: true
      purpose: "Visibility in CI logs"

    main_only:
      step_name: "Code Complexity Gate"
      command: "poetry run xenon --max-absolute C src/"
      continue_on_error: false
      purpose: "Block merge if any function exceeds CC 15"

  mise_tasks:
    complexity:
      command: "poetry run radon cc src/ -a -s --show-complexity"
      description: "Show full complexity report"

    complexity_check:
      command: "poetry run xenon --max-absolute C src/"
      description: "Run xenon gate (test before main PR)"

  pre_commit_integration:
    rule: "C901"
    config_location: "pyproject.toml [tool.ruff.lint]"
    setting: "max-complexity = 15"
    behavior: "Fails pre-commit if any function exceeds CC 15"
    rationale: "Immediate local feedback before push"

  scope:
    included:
      - "src/babylon/**/*.py"
    excluded:
      paths:
        - "tests/**/*.py"
      reason: "Test functions are intentionally verbose for clarity"

  known_patterns:
    acceptable_high_complexity:
      examples:
        - "State machines (explicit case handling)"
        - "Parsers with many grammar rules"
        - "Factory functions with many entity types"
      mitigation: |
        1. Refactor into smaller functions where possible
        2. If truly unavoidable, document WHY in PR description
        3. Xenon allows --exclude for specific modules (use sparingly)

    common_causes_of_high_cc:
      - "Nested if/elif chains (consider lookup tables)"
      - "Multiple early returns (consolidate conditions)"
      - "Try/except with many exception types (use base classes)"
      - "Boolean flag parameters (split into separate functions)"

  future_enhancements:
    wily:
      description: "Track complexity OVER TIME (detect regressions)"
      status: "Not implemented yet"
      use_case: "Could catch 'this PR increased average CC by 2 points'"

    path_based_thresholds:
      description: "Different CC limits for different code areas"
      status: "Not implemented yet"
      example: |
        - formulas.py: max CC 10 (pure math, no excuses)
        - engine/systems/*.py: max CC 15 (some coordination OK)

    cognitive_complexity:
      description: "Alternative to CC that weights nested structures higher"
      status: "Blocked - Ruff doesn't support yet"
      notes: "When Ruff adds cognitive complexity, consider switching"

# =============================================================================
# MUTATION TESTING
# =============================================================================

mutation_testing:
  philosophy: "Coverage lies - mutation testing proves tests actually catch bugs"

  rationale: |
    You can have 100% line coverage but still miss bugs. Mutation testing
    makes small changes to code (mutations) and verifies tests catch them.
    If tests pass with mutated code, you have a test gap.

  tool: "mutmut"
  package: "mutmut"
  config_file: "pyproject.toml [tool.mutmut]"

  how_it_works:
    - "Makes small changes (mutations) to source code"
    - "Runs test suite against each mutation"
    - "If tests still pass → mutant 'survived' (test gap!)"
    - "If tests fail → mutant 'killed' (tests are effective)"

  example_mutations:
    - "Change > to >= (boundary conditions)"
    - "Change + to - (arithmetic operators)"
    - "Replace return value with constant"
    - "Remove statement entirely"

  ci_integration:
    trigger: "PRs to main only"
    scope: "src/babylon/systems/formulas.py (critical pure math)"
    behavior: "Blocks merge if mutants survive"
    rationale: |
      formulas.py contains the mathematical core of the simulation.
      These functions MUST be correctly tested. Mutation testing
      ensures tests catch off-by-one errors, boundary issues, etc.

  mise_tasks:
    "mutate:full":
      command: "poetry run python tools/run_mutmut.py"
      description: "Run full mutation testing (overnight run)"

    "mutate:critical":
      command: "poetry run python tools/run_mutmut.py --critical"
      description: "Run mutation testing on critical formulas (~30 min)"

    "mutate:formulas":
      command: "poetry run mutmut run --paths-to-mutate=src/babylon/systems/formulas.py"
      description: "Run mutation testing on formulas only (~5-10 min)"

    "mutate:results":
      command: "poetry run mutmut results"
      description: "Show mutation testing results summary"

    "mutate:show":
      command: "poetry run mutmut show <id>"
      description: "Show specific mutant details"

    "mutate:html":
      command: "poetry run mutmut html"
      description: "Generate HTML report"

  workflow:
    periodic_audit:
      - "Run mise run mutate periodically (weekly or per-release)"
      - "Review surviving mutants with mise run mutate-results"
      - "Investigate specific mutants with mise run mutate-show <id>"
      - "Write tests to kill survivors"

    pr_to_main:
      - "CI automatically runs mutation testing"
      - "PR blocked if any mutants survive in formulas.py"
      - "Developer must add tests to kill survivors before merge"

  time_cost:
    formulas_py: "~15-30 minutes (200-400 mutations)"
    full_codebase: "Hours (not recommended for CI)"

  why_only_main:
    - "Mutation testing is slow (full test run per mutation)"
    - "PRs to main are rare (Director merges only)"
    - "Main is stable release branch - quality gate justified"
    - "Dev branches move fast - don't want to block velocity"

# =============================================================================
# PYTHON TOOLING
# =============================================================================

python:

  poetry:
    config_file: "pyproject.toml"
    version: "2.2.1"
    dependency_groups:
      main: "Core runtime dependencies"
      dev: "Testing, linting, type checking"
      docs: "Sphinx and documentation tools"

  pytest:
    config_file: "pyproject.toml"
    markers:
      unit: "Fast unit tests for isolated components"
      math: "Deterministic mathematical formulas"
      ledger: "Economic/Political state tests"
      topology: "Graph/Network operations"
      integration: "Database/ChromaDB tests"
      ai: "AI/RAG evaluation tests (slow, non-deterministic)"
    asyncio_mode: "strict"

  mise:
    config_file: ".mise.toml"
    purpose: "Task runner (namespace-driven - see ADR035)"
    convention: |
      Tasks use colon-namespaced naming for discoverability:
        test:*   - Testing by scope (unit, int, scenario)
        sim:*    - Rust simulation execution and observability
        reference:* - Frozen reference-engine tools
        analysis:*  - Development-only Python analysis
        qa:*     - Quality assurance and verification
        demo:*   - Integration demos
        data:*   - Data pipeline operations
        docs:*   - Documentation building
        mutate:* - Mutation testing
        midi:*   - Music generation
    key_tasks:
      check: "Non-mutating local gate: hosted static leaves + local contracts + test:unit"
      "check:quick": "Non-mutating lint + format + typecheck"
      "check:full-local": "Check plus workstation data-path and reference-catalog probes"
      fix: "Apply Ruff lint fixes and formatting sequentially"
      "test:unit": "Run unit tests only (fast)"
      "test:int": "Run integration tests (mechanics & systems)"
      "test:scenario": "Run scenario tests (slow, full arcs)"
      "test:all": "Run all non-AI tests"
      "reference:python-smoke": "Frozen Python one-tick reference smoke; not a persistence-authority path"
      "analysis:sweep": "Intentional in-memory Python optimization periphery"
      "analysis:monte-carlo": "Intentional in-memory Python uncertainty analysis"
      "analysis:campaign": "Bounded non-authoritative frozen-Python reference campaign; weekly by default"
      "sim:e2e-michigan": "One-shot Rust PostgreSQL/H3 validation; fresh unless BABYLON_CAMPAIGN_ID is explicit"
      "sim:e2e-bg": "Resume an explicit Rust Michigan campaign, or the worktree-local default, in the background"
      "sim:status": "Show the background process, its recorded campaign tail, and labeled global totals"
      "sim:probe": "Probe an explicit campaign, or the worktree-local default, plus labeled global totals"
      "sim:archive": "Inspect global Rust-owned Archive dirty receipts"
      "sim:report": "Generate authoritative Rust Michigan observability and persistence evidence"
      "dev:doctor": "Report worktree and Rust simulation tooling readiness without mutation"
      "analysis:optuna": "Development-only Bayesian optimization (Optuna TPE)"
      "analysis:landscape": "Development-only 2D parameter grid search"
      "analysis:dashboard": "Optuna Dashboard; root optuna.db by default or an explicit campaign SQLite path"
      "qa:verify": "Formula correctness verification"
      "qa:regression": "Frozen Python language-neutral behavior contract"
      "qa:vault-regression": "Retained in-process projection-vault byte gate"
      "demo:slice": "Full pipeline demo (Engine->RAG->LLM)"
      "docs:live": "Live-reload documentation server"
      # Parquet-canonical reference-data pipeline (2026-07-19 plan): sources
      # (parquet + schema.sql) are canonical; the SQLite reference DB is a
      # deterministic build product. Pipeline order: artifacts -> schema ->
      # build-db -> verify-build/verify-roundtrip -> subset.
      "data:artifacts": "Regenerate ALL reference sources (full-coverage parquet + manifest v2) from the live DB"
      "data:schema": "Extract canonical schema.sql from the live DB + update the manifest schema block"
      "data:build-db": "Rebuild the reference DB from parquet sources + schema.sql (product block updated)"
      "data:verify-build": "Build the reference DB twice from sources and prove byte-identity (dev box only)"
      "data:verify-roundtrip": "Content-compare the live reference DB against the rebuilt product"
      "data:subset": "Build the CI subset from the rebuilt product (subset drift dies by construction)"

# =============================================================================
# AUTHORITATIVE RUST SIMULATION OBSERVABILITY
# =============================================================================

rust_simulation_observability:
  authority: "Authoritative Rust Michigan game-state and PostgreSQL persistence path"
  command: "mise run sim:report 520 3000 exclusive"
  workflow: ".github/workflows/weekly-sim-artifacts.yml"
  artifact_root: "reports/sim-runs/<run>/"
  fixed_scope:
    replay_seed: 281
    parameter_overrides: false
    stochastic_draws: false
    dynamic_h3_updates: false
    content: "Embedded two-rule Michigan persistence slice, not all Rust content packs"
  persistence_readback: |
    Reopen PostgreSQL and read back committed state at each 52-tick annual
    boundary and at the final reported tick. In-process state alone does not
    satisfy the report contract.
  bundle:
    files:
      - "ticks.jsonl"
      - "ticks.csv"
      - "diagnostics.json"
      - "summary.json"
      - "summary.txt"
      - "stdout.txt"
      - "stderr.txt"
      - "resources.json"
    hash_roles:
      administrative_graph: "GraphStateHash; graph-only administrative persistence identity"
      stable_named_graph: "Canonical digest over authored stable graph identities"
      nominal_world: "Stable graph plus governed world registers"
      tick_content: "Identity of the complete committed tick content"
  resource_observation:
    runtime: "Wall, user CPU, and system CPU nanoseconds plus peak RSS bytes for the runtime process only"
    excluded_runtime_costs:
      - "Cargo build"
      - "Report wrapper"
      - "PostgreSQL"
      - "Artifact upload"
      - "Other job processes"
    database: "Before/after database, Babylon-relation, and cluster-wide WAL size observations"
    limitations: |
      The exclusive label states the expected attribution context, not exact
      per-tick byte accounting. WAL can include background activity, and
      database allocation, reuse, or delayed reclamation can produce coarse or
      negative deltas.

# Authored campaign values and current verification.
campaign_parameters:
  source: "content/scenarios/michigan/defines.toml"
  authority: "ADR258_authored_campaign_parameters"
  consumer: "babylon-runtime session --stdio --defines PATH"
  capture: "New validates and captures canonical parameters in the campaign foundation"
  restart: "Open reconstructs the stored parameters without reading the authoring file"
  interval: "One 28-day simulation transition; 13 periods per 52-week simulation year"
  scope: "Designed material stocks, schedules, recipes, capacities, orders, and delays"
  observed_data: "QCEW source values retain separate observed provenance and units"

testing_infrastructure:
  python: "Retained reference-data, repository, CI, provider, and operator contracts"
  rust: "Mechanics, BSL, deterministic replay, persistence, and client behavior"
  fast_python: "mise run test:unit-ci"
  release_remainder: "mise run test:rest-ci"
  current_postgres: "mise run test:rust-postgres"
  rust_without_documentation: "mise run rust:check-no-docs"
  reports: "tools/rust_test_report.py emits structured nextest results"
  historical_reference: |
    Python simulation, parameter sweeps, Monte Carlo, optimization studies,
    engine factories, and their CI jobs have been retired. Their code and
    recorded results remain recoverable in Git history; they are not live
    runtime dependencies or gates.
