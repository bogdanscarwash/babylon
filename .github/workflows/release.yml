name: Release

# Public downloads are tag-driven and must identify qualified main history.
# Dev commits only produce CI/version evidence. Tags are never moved and an
# existing release is never silently overwritten by a retry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing main vX.Y.Z tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  identity:
    name: Verify Main Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify exact source, protected ancestry and version
        id: verify
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          python3 tools/check_release_tag.py --tag "$RELEASE_TAG"
          MAIN_SHA="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$MAIN_SHA" refs/remotes/origin/dev
          python3 tools/release_lineage.py verify \
            --ref refs/remotes/origin/dev --tag "$RELEASE_TAG" --main-sha "$MAIN_SHA"
          echo "version=$(python3 tools/release_version.py --release-tag "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"
          echo "sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          ./tools/check_release_pins.sh

  release:
    name: Publish GitHub Release
    needs: [identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap-python
      - name: Verify dependency lock matches source declarations
        run: uv lock --check
      - name: Source smoke
        run: |
          uv run --frozen python -c "import babylon"
          uv run --frozen babylon --help
      - name: Promote the exact main-qualified native package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/dev:refs/remotes/origin/dev
          python3 tools/release_artifact.py --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --output-dir release-download
      - name: Verify release download checksums
        working-directory: release-download
        run: sha256sum --check ./*.sha256
      - name: Extract release notes for this tag
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          heading = f"## v{os.environ['RELEASE_VERSION']} ("
          lines = Path("CHANGELOG.md").read_text().splitlines(keepends=True)
          starts = [index for index, line in enumerate(lines) if line.startswith(heading)]
          if len(starts) != 1:
              raise SystemExit("Expected one canonical changelog section for this release")
          start = starts[0]
          end = next((index for index in range(start + 1, len(lines))
                      if lines[index].startswith("## ")), len(lines))
          Path("release-notes.md").write_text("".join(lines[start:end]))
          PY
          cat tools/release/DOWNLOAD.md >> release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          options=()
          if [[ "$RELEASE_VERSION" == 0.* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Babylon $RELEASE_VERSION — native observer preview" \
            --notes-file release-notes.md "${options[@]}"
          gh release upload "$RELEASE_TAG" release-download/*.tar.gz \
            release-download/*.sha256 release-download/release-provenance.json
          gh release edit "$RELEASE_TAG" --draft=false
