name: Native Package

# Called by full main qualification and the tag-driven main release. Dev PRs
# keep their fast executable gates; this builds the actual public download.
on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
    outputs:
      artifact-name:
        description: Verified native package and checksums
        value: ${{ jobs.linux.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
      - uses: ./.github/actions/bootstrap-python
      - name: Resolve exact package identity
        id: identity
        env:
          SOURCE_REF: ${{ inputs.source-ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          echo "sha=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 tools/release_version.py --release-version)" >> "$GITHUB_OUTPUT"
          echo "artifact-name=native-linux-x86_64" >> "$GITHUB_OUTPUT"
      - name: Install native build and clean-unpack runtime dependencies
        run: >-
          tools/install_ci_apt_packages.sh
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libpq5
          xvfb
      - name: Install the pinned Rust toolchain
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal --no-self-update
      - name: Build both native executables with locked dependencies
        working-directory: rust
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          cargo build --locked --release \
            -p babylon-client --bin babylon-client \
            -p babylon-persistence --bin babylon-runtime
      - name: Assemble the versioned download
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.identity.outputs.sha }}
        run: >-
          python3 tools/release/package_linux.py
          --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA"
          --binaries-dir rust/target/release --output-dir dist/release
      - name: Verify and exercise the unpacked download
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          cd dist/release
          sha256sum --check "babylon-${RELEASE_VERSION}-linux-x86_64.tar.gz.sha256"
          mkdir unpacked
          tar --extract --gzip --file="babylon-${RELEASE_VERSION}-linux-x86_64.tar.gz" --directory=unpacked
          cd "unpacked/babylon-${RELEASE_VERSION}-linux-x86_64"
          ./babylon --smoke
      - name: Upload verified download and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
