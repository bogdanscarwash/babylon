# Share the pinned image build with the disposable PostgreSQL test runner.
name: Postgres Up
description: Build babylon-pg with GHA layer cache, then compose up --wait

runs:
  using: composite
  steps:
    - name: Build PostgreSQL
      uses: ./.github/actions/build-postgres

    - name: Start Postgres (compose, port 5433)
      shell: bash
      run: tools/ci_postgres_compose.sh up
