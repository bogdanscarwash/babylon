[tool.rstcheck]
report_level = "WARNING"
ignore_roles = [
    "hope",
    "hopedim",
]
ignore_directives = [
    "mermaid",
    "todo",
    "automodule",
    "autoclass",
    "autofunction",
    "autosummary",
    "toctree",
    "only",
]
ignore_substitutions = [
    "release",
    "version",
]

[tool.hypothesis]
deadline = 500
max_examples = 100

[tool.babylon.cross_scale]
# Spec 062 cross-scale integration tunables (FR-029 / FR-029a / FR-046 / FR-004a).
# These mirror the EconomyDefines fields and document the default values for
# YAML/CLI overrides. See specs/062-cross-scale-integration/data-model.md §2.5.
alpha_annual = 0.01            # FR-029: annual capital-equalization rate
epsilon_conservation = 1e-10   # FR-046: conservation-residual tolerance
scenario_length_years = 15     # FR-004a: immutable scenario length

[tool.babylon.logging]
default_level = "INFO"
console_level = "INFO"
file_level = "DEBUG"

[tool.babylon.logging.modules]
"babylon.engine" = "INFO"
"babylon.engine.systems" = "INFO"
"babylon.engine.simulation" = "INFO"
"babylon.intelligence.rag" = "INFO"
"babylon.intelligence.rag.retrieval" = "INFO"
"babylon.intelligence.rag.embeddings" = "INFO"
"babylon.intelligence.rag.chunker" = "INFO"
httpx = "WARNING"
httpcore = "WARNING"
urllib3 = "WARNING"
asyncio = "WARNING"

[build-system]
# hatchling replaced poetry-core 2026-07-22 — the last Poetry artifact in
# the toolchain (tasks/lock/CI went uv in ADR095's train). Chosen over
# uv_build for explicit src-layout packages= control.
requires = [
    "hatchling>=1.32.0",
]
build-backend = "hatchling.build"

[tool.pyright]
extraPaths = ["."]

# ── Import-boundary contracts (Program 14, Phase 1) ─────────────────────────
# Runtime layering law: kernel < models/formulas < domain < engine. Engine may
# import downward; nothing imports the engine back. TYPE_CHECKING imports are
# excluded — annotations may reference upward, the import graph may not.
# Run: poetry run lint-imports (wired into mise check + pre-commit + CI).
[tool.importlinter]
root_packages = ["babylon"]
exclude_type_checking_imports = true
# Externals enter the graph squashed; the babylon-internal contracts are
# unaffected by this flag.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "the domain must not import the engine (kernel abstractions only)"
type = "forbidden"
source_modules = ["babylon.domain"]
forbidden_modules = ["babylon.engine"]

[[tool.importlinter.contracts]]
name = "persistence must not import the engine"
type = "forbidden"
source_modules = ["babylon.persistence"]
forbidden_modules = ["babylon.engine"]

[[tool.importlinter.contracts]]
name = "formulas are pure math — no engine imports"
type = "forbidden"
source_modules = ["babylon.formulas"]
forbidden_modules = ["babylon.engine"]

[[tool.importlinter.contracts]]
name = "kernel is layer 0 — imports nothing above itself"
type = "forbidden"
source_modules = ["babylon.kernel"]
